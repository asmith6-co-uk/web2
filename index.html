<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="asmith6.co.uk is being refreshed and will be updated soon." />
  <title>asmith6.co.uk</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 34rem),
        linear-gradient(135deg, #020617 0%, var(--bg) 55%, #1e293b 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      width: 100%;
      max-width: 760px;
      background: rgba(17, 24, 39, 0.82);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: clamp(2rem, 6vw, 4rem);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    .label {
      display: inline-block;
      margin-bottom: 1.25rem;
      padding: 0.45rem 0.75rem;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    p {
      margin: 0;
      max-width: 36rem;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      line-height: 1.65;
    }

    .footer {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: #94a3b8;
      font-size: 0.95rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    a:hover,
    a:focus {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <div class="label">Website refresh in progress</div>
    <h1>asmith6.co.uk</h1>
    <p>
      This site is being updated. The old page has been retired, and something more useful will appear here soon.
    </p>
    <div class="footer">
      &copy; 2026 asmith6.co.uk &middot; Contact: <a href="mailto:me@asmith6.co.uk">me@asmith6.co.uk</a>
    </div>
  </main>
</body>
</html>
